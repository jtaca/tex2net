[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tex2net"
version = "1.41"
description = "Build character graphs from text."
authors = [
  { name = "jtaca", email = "joaotiagoaparicio@gmail.com" }
]
readme = "README.md"
license = "GPL-3.0-only"
keywords = ["knowledge-graph", "NLP", "unstructured-data", "slm"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent"
]
requires-python = ">=3.10"

dependencies = [
  "graphviz",
  "pyyaml",
  "python-docx",
  "python-dotenv",
  "PyPDF2",
  "lxml",
  "spacy>=3.8.13,<4",
  "networkx>=2.0",
  "matplotlib>=3.0",
  "transformers>=4.0",
  "torch",
  "pyvis",
  "python-louvain",
  "pandas",
  "sentencepiece",
  "protobuf",
  "typing_extensions",
  "numpy<2"
]

[project.urls]
"Source" = "https://github.com/jtaca/tex2net"
"Tracker" = "https://github.com/jtaca/tex2net/issues"

[tool.setuptools.packages.find]
include = ["tex2net*"]
